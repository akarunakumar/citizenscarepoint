server.port=8080

spring.datasource.url=jdbc:postgresql://citizencarepoint-db:5432/citizencarepoint
spring.datasource.username=citizencare
spring.datasource.password=citizencare
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:this-is-a-local-dev-only-secret-change-it-before-deploying-anywhere-real}
app.jwt.expiration-ms=86400000
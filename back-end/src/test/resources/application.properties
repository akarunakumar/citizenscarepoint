# Used automatically during `mvn test` — takes priority over
# src/main/resources/application.properties on the test classpath, so
# tests run against fast, disposable H2 instead of needing Postgres
# running via Docker.
spring.datasource.url=jdbc:h2:mem:citizencarepoint-test
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

app.jwt.secret=test-only-secret-not-used-in-production-1234567890
app.jwt.expiration-ms=3600000

<div class="container">
  <form class="form-card" [formGroup]="form" (ngSubmit)="submit()" style="max-width:460px; margin: var(--space-xl) auto;">
    <h1>Create your account</h1>
    <p class="form-subtext">Join CitizenCarePoint.</p>

    @if (statusMessage(); as msg) {
      <div class="form-status visible" [style.color]="msg.isError ? 'var(--color-error)' : 'var(--color-available)'"
           [style.background]="msg.isError ? 'rgba(169,59,59,0.12)' : 'rgba(46,125,107,0.12)'">
        {{ msg.text }}
      </div>
    }

    <div class="field">
      <label for="regName">Name</label>
      <input type="text" id="regName" formControlName="name" placeholder="Your full name" />
    </div>
    <div class="field">
      <label for="regEmail">Email</label>
      <input type="email" id="regEmail" formControlName="email" placeholder="you@example.com" />
    </div>
    <div class="field">
      <label for="regMobile">Mobile</label>
      <input type="tel" id="regMobile" formControlName="mobile" placeholder="+91 90000 00000" />
    </div>
    <div class="field">
      <label for="regPassword">Password</label>
      <input type="password" id="regPassword" formControlName="password" placeholder="••••••••" />
    </div>
    <div class="field">
      <label for="regConfirmPassword">Confirm Password</label>
      <input type="password" id="regConfirmPassword" formControlName="confirmPassword" placeholder="••••••••" />
    </div>
    <p style="font-size: var(--fs-caption); color: var(--color-muted); margin-top:-0.75rem;">
      Your password is stored as a secure hash on our backend — never in plain text.
    </p>

    <button type="submit" class="btn btn-primary btn-block">Register</button>

    <p class="form-footnote">Already have an account? <a routerLink="/login">Login here</a></p>
  </form>
</div>

<div class="container">
  <form class="form-card" [formGroup]="form" (ngSubmit)="submit()" style="max-width:460px; margin: var(--space-xl) auto;">
    <h1>Welcome back</h1>
    <p class="form-subtext">Log in to CitizenCarePoint.</p>

    @if (statusMessage(); as msg) {
      <div class="form-status visible" [style.color]="msg.isError ? 'var(--color-error)' : 'var(--color-available)'"
           [style.background]="msg.isError ? 'rgba(169,59,59,0.12)' : 'rgba(46,125,107,0.12)'">
        {{ msg.text }}
      </div>
    }

    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" formControlName="email" placeholder="you@example.com" />
    </div>

    <div class="field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" formControlName="password" placeholder="••••••••" />
    </div>
    <p style="font-size: var(--fs-caption); color: var(--color-muted); margin-top:-0.75rem;">
      Your password is checked against a real, securely hashed account on our backend.
    </p>

    <button type="submit" class="btn btn-primary btn-block">Login</button>

    <p class="form-footnote">Don't have an account? <a routerLink="/register">Register here</a></p>
  </form>
</div>
